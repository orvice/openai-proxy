syntax = "proto3";

package llm.v1;

import "google/api/annotations.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "llm/v1/common.proto";

option go_package = "github.com/orvice/aiproxy/pkg/proto/llm/v1;llmv1";

service TenantService {
  rpc CreateTenant(CreateTenantRequest) returns (CreateTenantResponse) {
    option (google.api.http) = {
      post: "/admin/v1/tenants"
      body: "*"
    };
  }
  rpc GetTenant(GetTenantRequest) returns (GetTenantResponse) {
    option (google.api.http) = {get: "/admin/v1/tenants/{tenant_id}"};
  }
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse) {
    option (google.api.http) = {get: "/admin/v1/tenants"};
  }
  rpc UpdateTenant(UpdateTenantRequest) returns (UpdateTenantResponse) {
    option (google.api.http) = {
      patch: "/admin/v1/tenants/{tenant.id}"
      body: "*"
    };
  }
  rpc SuspendTenant(SuspendTenantRequest) returns (SuspendTenantResponse) {
    option (google.api.http) = {
      post: "/admin/v1/tenants/{tenant_id}:suspend"
      body: "*"
    };
  }
  rpc ArchiveTenant(ArchiveTenantRequest) returns (ArchiveTenantResponse) {
    option (google.api.http) = {
      post: "/admin/v1/tenants/{tenant_id}:archive"
      body: "*"
    };
  }
}

service ProjectService {
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse) {
    option (google.api.http) = {
      post: "/admin/v1/tenants/{tenant_id}/projects"
      body: "*"
    };
  }
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse) {
    option (google.api.http) = {get: "/admin/v1/projects/{project_id}"};
  }
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse) {
    option (google.api.http) = {get: "/admin/v1/tenants/{tenant_id}/projects"};
  }
  rpc UpdateProject(UpdateProjectRequest) returns (UpdateProjectResponse) {
    option (google.api.http) = {
      patch: "/admin/v1/projects/{project.id}"
      body: "*"
    };
  }
  rpc ArchiveProject(ArchiveProjectRequest) returns (ArchiveProjectResponse) {
    option (google.api.http) = {
      post: "/admin/v1/projects/{project_id}:archive"
      body: "*"
    };
  }
}

service MembershipService {
  rpc CreateMembership(CreateMembershipRequest) returns (CreateMembershipResponse) {
    option (google.api.http) = {
      post: "/admin/v1/memberships"
      body: "*"
    };
  }
  rpc ListMemberships(ListMembershipsRequest) returns (ListMembershipsResponse) {
    option (google.api.http) = {get: "/admin/v1/memberships"};
  }
  rpc DeleteMembership(DeleteMembershipRequest) returns (DeleteMembershipResponse) {
    option (google.api.http) = {delete: "/admin/v1/memberships/{membership_id}"};
  }
}

message Tenant {
  string id = 1;
  string name = 2;
  string display_name = 3;
  ResourceStatus status = 4;
  BillingMode billing_mode = 5;
  string billing_profile_id = 6;
  Metadata metadata = 7;
  AuditInfo audit_info = 8;
  repeated Condition conditions = 9;
}

message Project {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  string display_name = 4;
  string description = 5;
  ResourceStatus status = 6;
  string environment = 7;
  Metadata metadata = 8;
  AuditInfo audit_info = 9;
}

message Membership {
  string id = 1;
  string tenant_id = 2;
  string project_id = 3;
  string principal_id = 4;
  string principal_type = 5;
  repeated MembershipRole roles = 6;
  ResourceStatus status = 7;
  google.protobuf.Timestamp expires_at = 8;
  AuditInfo audit_info = 9;
}

message CreateTenantRequest {
  Tenant tenant = 1;
}

message CreateTenantResponse {
  Tenant tenant = 1;
}

message GetTenantRequest {
  string tenant_id = 1;
}

message GetTenantResponse {
  Tenant tenant = 1;
}

message ListTenantsRequest {
  PageRequest page = 1;
  ResourceStatus status = 2;
}

message ListTenantsResponse {
  repeated Tenant tenants = 1;
  PageResponse page = 2;
}

message UpdateTenantRequest {
  Tenant tenant = 1;
  google.protobuf.FieldMask update_mask = 2;
}

message UpdateTenantResponse {
  Tenant tenant = 1;
}

message SuspendTenantRequest {
  string tenant_id = 1;
  string reason = 2;
}

message SuspendTenantResponse {
  Tenant tenant = 1;
}

message ArchiveTenantRequest {
  string tenant_id = 1;
  string reason = 2;
}

message ArchiveTenantResponse {
  Tenant tenant = 1;
}

message CreateProjectRequest {
  string tenant_id = 1;
  Project project = 2;
}

message CreateProjectResponse {
  Project project = 1;
}

message GetProjectRequest {
  string project_id = 1;
}

message GetProjectResponse {
  Project project = 1;
}

message ListProjectsRequest {
  string tenant_id = 1;
  PageRequest page = 2;
  ResourceStatus status = 3;
}

message ListProjectsResponse {
  repeated Project projects = 1;
  PageResponse page = 2;
}

message UpdateProjectRequest {
  Project project = 1;
  google.protobuf.FieldMask update_mask = 2;
}

message UpdateProjectResponse {
  Project project = 1;
}

message ArchiveProjectRequest {
  string project_id = 1;
  string reason = 2;
}

message ArchiveProjectResponse {
  Project project = 1;
}

message CreateMembershipRequest {
  Membership membership = 1;
}

message CreateMembershipResponse {
  Membership membership = 1;
}

message ListMembershipsRequest {
  string tenant_id = 1;
  string project_id = 2;
  string principal_id = 3;
  PageRequest page = 4;
}

message ListMembershipsResponse {
  repeated Membership memberships = 1;
  PageResponse page = 2;
}

message DeleteMembershipRequest {
  string membership_id = 1;
}

message DeleteMembershipResponse {
  string membership_id = 1;
}
